[env:esp32dev]
; pioarduino: Arduino core 3.x (ESP-IDF 5.x), tag "stable" — актуальный релиз
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ВАЖНО: без lib_ldf_mode = deep+ !
; deep+ не подхватывает библиотеку Network (зависимость WiFi в core 3.x)
; и сборка падает с "Network.h: No such file or directory"

lib_deps =
    robtillaart/AD9833 @ ^0.4.5
    olikraus/U8g2 @ ^2.35.30
