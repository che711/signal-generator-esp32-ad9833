[env:esp32dev]
; pioarduino: Arduino core 3.x (ESP-IDF 5.x), "stable" tag — current release
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Warnings for src/ only — libraries have plenty of their own
build_src_flags = -Wall -Wextra

; IMPORTANT: do not set lib_ldf_mode = deep+ !
; deep+ fails to pick up the Network library (a WiFi dependency in core 3.x)
; and the build dies with "Network.h: No such file or directory"

lib_deps =
    robtillaart/AD9833 @ ^0.4.5
    olikraus/U8g2 @ ^2.35.30
